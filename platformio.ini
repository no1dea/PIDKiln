; PIDKiln — PlatformIO / pioarduino (Arduino-ESP32 3.3.x)
; Every PK_FEATURE_* must be set exactly once per env (fail-closed in PIDKiln_features.h).

[platformio]
default_envs = esp32-wrover
src_dir = src
data_dir = data

[common]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_compat_mode = strict
lib_ldf_mode = chain
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
test_ignore = *
extra_scripts = post:merge_firmware.py
build_flags =
	-DTEMPLATE_PLACEHOLDER=126
	-DDEBUG=1
lib_deps =
	br3ttb/PID @ 1.2.1
	adafruit/Adafruit MAX31855 library @ 1.4.2
	adafruit/Adafruit BusIO @ 1.17.4

; Full product kit (LCD+WiFi+HTTP+logs+EMR+alarm+housing+syslog). SSR2/ENERGY opt-in separately.
[feat_full]
build_flags =
	-DPK_FEATURE_LOCAL_UI=1
	-DPK_FEATURE_WIFI=1
	-DPK_FEATURE_HTTP=1
	-DPK_FEATURE_LOGS=1
	-DPK_FEATURE_EMR=1
	-DPK_FEATURE_ALARM=1
	-DPK_FEATURE_HOUSING_TC=1
	-DPK_FEATURE_SSR2=0
	-DPK_FEATURE_ENERGY=0
	-DPK_FEATURE_SYSLOG=1
lib_deps =
	https://github.com/olikraus/U8g2_Arduino.git#2.36.19
	ESP32Async/AsyncTCP @ 3.6.1
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	arcao/Syslog @ 2.0.1
build_src_filter =
	+<*>
	-<PIDKiln_ssr2.cpp>
	-<PIDKiln_energy.cpp>

[feat_core]
build_flags =
	-DPK_FEATURE_LOCAL_UI=0
	-DPK_FEATURE_WIFI=0
	-DPK_FEATURE_HTTP=0
	-DPK_FEATURE_LOGS=0
	-DPK_FEATURE_EMR=0
	-DPK_FEATURE_ALARM=0
	-DPK_FEATURE_HOUSING_TC=0
	-DPK_FEATURE_SSR2=0
	-DPK_FEATURE_ENERGY=0
	-DPK_FEATURE_SYSLOG=0
build_src_filter =
	+<*>
	-<PIDKiln_lcd.cpp>
	-<PIDKiln_input.cpp>
	-<PIDKiln_net.cpp>
	-<PIDKiln_http.cpp>
	-<PIDKiln_logs.cpp>
	-<PIDKiln_emr.cpp>
	-<PIDKiln_alarm.cpp>
	-<PIDKiln_housing_tc.cpp>
	-<PIDKiln_ssr2.cpp>
	-<PIDKiln_energy.cpp>

[env:esp32-wrover]
extends = common
board = esp-wrover-kit
build_flags =
	${common.build_flags}
	${feat_full.build_flags}
	-DMALLOC=ps_malloc
	-DREALLOC=ps_realloc
	-DBOARD_HAS_PSRAM
lib_deps =
	${common.lib_deps}
	${feat_full.lib_deps}
build_src_filter = ${feat_full.build_src_filter}

[env:esp32-wrover-release]
extends = common
board = esp-wrover-kit
; Larger dual-OTA app slots (1408 KiB); first flash needs full erase.
board_build.partitions = partitions/ota_large_app.csv
build_flags =
	-DTEMPLATE_PLACEHOLDER=126
	-DDEBUG=0
	${feat_full.build_flags}
	-DMALLOC=ps_malloc
	-DREALLOC=ps_realloc
	-DBOARD_HAS_PSRAM
lib_deps =
	${common.lib_deps}
	${feat_full.lib_deps}
build_src_filter = ${feat_full.build_src_filter}

[env:esp32-wroom]
extends = common
board = esp32dev
extra_scripts =
build_flags =
	${common.build_flags}
	${feat_full.build_flags}
	-DMALLOC=malloc
	-DREALLOC=realloc
lib_deps =
	${common.lib_deps}
	${feat_full.lib_deps}
build_src_filter = ${feat_full.build_src_filter}

[env:esp32-wrover-web]
extends = common
board = esp-wrover-kit
build_flags =
	${common.build_flags}
	-DPK_FEATURE_LOCAL_UI=0
	-DPK_FEATURE_WIFI=1
	-DPK_FEATURE_HTTP=1
	-DPK_FEATURE_LOGS=1
	-DPK_FEATURE_EMR=1
	-DPK_FEATURE_ALARM=1
	-DPK_FEATURE_HOUSING_TC=1
	-DPK_FEATURE_SSR2=0
	-DPK_FEATURE_ENERGY=0
	-DPK_FEATURE_SYSLOG=1
	-DMALLOC=ps_malloc
	-DREALLOC=ps_realloc
	-DBOARD_HAS_PSRAM
lib_deps =
	${common.lib_deps}
	ESP32Async/AsyncTCP @ 3.6.1
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	arcao/Syslog @ 2.0.1
build_src_filter =
	+<*>
	-<PIDKiln_lcd.cpp>
	-<PIDKiln_input.cpp>
	-<PIDKiln_ssr2.cpp>
	-<PIDKiln_energy.cpp>

[env:esp32-wrover-local]
extends = common
board = esp-wrover-kit
build_flags =
	${common.build_flags}
	-DPK_FEATURE_LOCAL_UI=1
	-DPK_FEATURE_WIFI=0
	-DPK_FEATURE_HTTP=0
	-DPK_FEATURE_LOGS=1
	-DPK_FEATURE_EMR=1
	-DPK_FEATURE_ALARM=1
	-DPK_FEATURE_HOUSING_TC=1
	-DPK_FEATURE_SSR2=0
	-DPK_FEATURE_ENERGY=0
	-DPK_FEATURE_SYSLOG=0
	-DMALLOC=ps_malloc
	-DREALLOC=ps_realloc
	-DBOARD_HAS_PSRAM
lib_deps =
	${common.lib_deps}
	https://github.com/olikraus/U8g2_Arduino.git#2.36.19
build_src_filter =
	+<*>
	-<PIDKiln_net.cpp>
	-<PIDKiln_http.cpp>
	-<PIDKiln_ssr2.cpp>
	-<PIDKiln_energy.cpp>

[env:esp32-wrover-core]
extends = common
board = esp-wrover-kit
build_flags =
	${common.build_flags}
	${feat_core.build_flags}
	-DMALLOC=ps_malloc
	-DREALLOC=ps_realloc
	-DBOARD_HAS_PSRAM
lib_deps = ${common.lib_deps}
build_src_filter = ${feat_core.build_src_filter}

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=c++17
lib_ldf_mode = chain+
build_src_filter = -<**/*>
