; PIDKiln — PlatformIO / pioarduino (Arduino-ESP32 3.3.x)
; For a later 4.x bump: change the platform URL pin and retest.

[platformio]
default_envs = esp32-wrover
src_dir = src
data_dir = data

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_compat_mode = strict
lib_ldf_mode = chain
; TEMPLATE_PLACEHOLDER must be ASCII 126 ('~') — quoted char literals break on Windows PIO flags.
build_flags =
	-DTEMPLATE_PLACEHOLDER=126
	-DRELAX_WDT_FOR_ASYNCTCP=1
	-DDEBUG=1
	-DMALLOC=ps_malloc
	-DREALLOC=ps_realloc
lib_deps =
	ESP32Async/AsyncTCP @ 3.6.1
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	br3ttb/PID @ 1.2.1
	olikraus/U8g2 @ 2.36.18
	arcao/Syslog @ 2.0.1
	https://github.com/Saur0o0n/MAX31855.git#acba88544aa067bc37f087aa64d37062b996114a

; Default: ESP32-Wrover (PSRAM). Matches README TTGO/Wrover target.
[env:esp32-wrover]
board = esp-wrover-kit
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM

; Optional: ESP32-Wroom without PSRAM (uses heap malloc).
[env:esp32-wroom]
board = esp32dev
build_flags =
	-DTEMPLATE_PLACEHOLDER=126
	-DRELAX_WDT_FOR_ASYNCTCP=1
	-DDEBUG=1
	-DMALLOC=malloc
	-DREALLOC=realloc
lib_deps =
	${env.lib_deps}
