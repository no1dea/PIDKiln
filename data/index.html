<!DOCTYPE html>
<html lang="en">
<head>
 <title>PIDKiln — Main view</title>
 <link rel="stylesheet" href="/css/main.css">
 <link rel="stylesheet" href="/css/nav.css">
 <script src="/js/nav.js"></script>
 <script src="/js/Chart.2.9.4.bundle.min.js"></script>
 <script src="/js/chartjs-datasource.min.js"></script>
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta charset="utf-8">
</head>
<body>

 <nav class="topnav" id="myTopnav" aria-label="Main">
  <a href="/index.html" class="active" aria-current="page">Main view</a>
  <a href="/programs/index.html">Manage programs</a>
  <a href="/logs/index.html">Logs</a>
  <a href="/preferences.html">Preferences</a>
  <a href="/about.html">About</a>
  <a href="/debug_board.html">Debug ESP</a>
  <a href="/flash_firmware.html">Flash firmware</a>
  <button type="button" class="nav-toggle" onclick="switch_nav()" aria-label="Open menu">
    <img src="/icons/menu.png" alt="">
  </button>
 </nav>

 <main class="shell dashboard">
  <h1 class="visually-hidden">PIDKiln main view</h1>

  <section class="hero-metric" aria-label="Kiln temperature">
   <span class="label">Kiln</span>
   <output class="value" id="kiln_temp" aria-live="polite">—</output>
   <span class="unit">°C</span>
  </section>

  <div class="metrics-grid">
   <section class="metric-panel" aria-labelledby="temps-heading">
    <h2 id="temps-heading">Temperatures</h2>
    <dl class="metric-list">
     <dt><label for="set_temp">Set</label></dt>
     <dd><output id="set_temp">—</output> °C</dd>
     <dt><label for="env_temp">Environment</label></dt>
     <dd><output id="env_temp">—</output> °C</dd>
     <dt><label for="case_temp">Housing</label></dt>
     <dd><output id="case_temp">—</output> °C</dd>
    </dl>
   </section>

   <section class="metric-panel" aria-labelledby="timing-heading">
    <h2 id="timing-heading">Timing</h2>
    <dl class="metric-list">
     <dt><label for="prog_start">Start</label></dt>
     <dd><output id="prog_start">—</output></dd>
     <dt><label for="prog_end">ETA</label></dt>
     <dd><output id="prog_end">—</output></dd>
     <dt><label for="curr_time">Current</label></dt>
     <dd><output id="curr_time">—</output></dd>
     <dt><label for="step">Step</label></dt>
     <dd><output id="step">0 of 0</output></dd>
    </dl>
   </section>

   <section class="metric-panel" aria-labelledby="pid-heading">
    <h2 id="pid-heading">PID</h2>
    <dl class="metric-list">
     <dt><label for="heat_time">Heat</label></dt>
     <dd><output id="heat_time">0</output> %</dd>
     <dt><label for="temp_change">Ramp</label></dt>
     <dd><output id="temp_change">0.0</output> °C/s</dd>
    </dl>
   </section>
  </div>

  <div class="PIDChart">
   <canvas id="ProgramChart"></canvas>
  </div>

  <section class="control-strip" aria-labelledby="control-heading">
   <h2 id="control-heading">Program control</h2>
   <form method="post" action="/index.html">
    <div class="for_submit">
     <input type="submit" id="start_bttn" name="prog_start" value="Start program">
     <input type="submit" id="pause_bttn" name="prog_pause" value="Pause program">
     <input type="submit" id="end_bttn" name="prog_end" value="End program">
     <input type="submit" id="abort_bttn" name="prog_abort" value="Abort program">
    </div>
   </form>
  </section>
 </main>

 <script src="/js/chart.js"></script>
 <script src="/js/json.js"></script>

</body>
</html>
