<!DOCTYPE html>
<html lang="en">
<head>
 <title>PIDKiln — Programs</title>
 <link rel="stylesheet" href="/css/main.css">
 <link rel="stylesheet" href="/css/nav.css">
 <script src="/js/nav.js"></script>
 <script src="/js/programs.js"></script>
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta charset="utf-8">
</head>
<body>

 <nav class="topnav" id="myTopnav" aria-label="Main">
  <a href="/index.html">Main view</a>
  <a href="/programs/index.html" class="active" aria-current="page">Manage programs</a>
  <a href="/logs/index.html">Logs</a>
  <a href="/preferences.html">Preferences</a>
  <a href="/about.html">About</a>
  <a href="/debug_board.html">Debug ESP</a>
  <a href="/flash_firmware.html">Flash firmware</a>
  <button type="button" class="nav-toggle" onclick="switch_nav()" aria-label="Open menu">
    <img src="/icons/menu.png" alt="">
  </button>
 </nav>

 <main class="shell">
  <div class="container">
   <h1>Programs</h1>
   <p class="form-actions" style="margin-bottom:1rem">
    <a class="btn" href="/program_edit.html">New program (curve editor)</a>
   </p>
   <table class="file-table">
    <thead>
     <tr>
      <th scope="col"></th>
      <th scope="col">Name</th>
      <th scope="col">Size</th>
      <th scope="col">Description</th>
      <th scope="col">Edit</th>
      <th scope="col">Load</th>
      <th scope="col">Delete</th>
     </tr>
    </thead>
    <tbody>
<!--PIDKILN_ROWS-->
    </tbody>
   </table>

   <form method="post" action="/upload" enctype="multipart/form-data">
    <fieldset>
     <legend>Upload new program</legend>
     <div class="row">
      <div class="col-25">
       <label for="upload_program">Choose a program file</label>
      </div>
      <div class="col-75">
       <input type="file" name="upload" id="upload_program" accept=".json,application/json" onchange="ValidateSize(this)">
      </div>
     </div>
     <div class="form-actions">
      <span></span>
      <input type="submit" value="Upload new program">
     </div>
    </fieldset>
   </form>

  </div>
 </main>
</body>
</html>
